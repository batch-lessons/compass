<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lessons Hub — عرض الدرس</title>

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Design tokens for Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#4F46E5', hover: '#4338CA', soft: '#EEF2FF' },
            ink: '#1F2937',
            muted: '#6B7280',
            surface: '#FFFFFF',
            page: '#FAFAFA',
          },
          fontFamily: { cairo: ['Cairo', 'sans-serif'] },
          boxShadow: {
            card: '0 2px 10px rgba(17, 24, 39, 0.05), 0 1px 2px rgba(17, 24, 39, 0.04)',
            'card-hover': '0 16px 32px rgba(79, 70, 229, 0.14), 0 4px 10px rgba(17, 24, 39, 0.06)',
          },
          borderRadius: { card: '0.75rem' },
        }
      }
    }
  </script>

  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="font-cairo bg-page text-ink min-h-screen flex flex-col overflow-hidden">

  <!-- ============ SLIM TOP BAR ============ -->
  <header class="lesson-topbar anim-init sticky top-0 z-40 h-14 bg-white/90 backdrop-blur-md border-b border-gray-100">
    <div class="h-full max-w-6xl mx-auto px-3 sm:px-5 flex items-center gap-3">

      <!-- Back -->
      <button id="back-btn"
              class="icon-btn shrink-0 inline-flex items-center gap-2 text-sm font-bold text-muted hover:text-primary hover:bg-primary-soft rounded-xl px-3 py-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="hidden sm:inline">رجوع</span>
      </button>

      <!-- Title -->
      <h1 id="lesson-title"
          class="flex-1 min-w-0 text-center text-sm sm:text-base font-extrabold text-ink truncate px-1">
        جارٍ التحميل…
      </h1>

      <!-- Fullscreen toggle -->
      <button id="fullscreen-btn" aria-label="ملء الشاشة" class="icon-btn shrink-0 w-10 h-10 rounded-xl flex items-center justify-center text-muted hover:bg-gray-100 hover:text-primary transition-colors">
        <svg id="fullscreen-icon-expand" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 8V5a1 1 0 0 1 1-1h3M20 8V5a1 1 0 0 0-1-1h-3M4 16v3a1 1 0 0 0 1 1h3M20 16v3a1 1 0 0 1-1 1h-3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg id="fullscreen-icon-collapse" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M9 4v3a1 1 0 0 1-1 1H5M15 4v3a1 1 0 0 0 1 1h3M9 20v-3a1 1 0 0 0-1-1H5M15 20v-3a1 1 0 0 1 1-1h3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Download -->
      <a id="download-btn" href="#" download target="_blank" rel="noopener"
         class="icon-btn btn-primary shrink-0 inline-flex items-center gap-2 bg-primary hover:bg-primary-hover text-white text-sm font-bold rounded-xl px-3 sm:px-4 py-2 shadow-card">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="hidden sm:inline">تحميل</span>
      </a>
    </div>
  </header>

  <!-- ============ VIEWER ============ -->
  <main class="lesson-viewer-shell relative w-full">

    <!-- Loading state -->
    <div id="loading-state" class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-page">
      <div class="spinner"></div>
      <p class="text-sm font-semibold text-muted">جارٍ تحميل الملف…</p>
    </div>

    <!-- Error / empty state -->
    <div id="error-state" class="absolute inset-0 hidden flex-col items-center justify-center text-center px-6 bg-page">
      <div class="w-20 h-20 rounded-3xl bg-primary-soft flex items-center justify-center text-4xl mb-5">📄</div>
      <h2 class="text-lg font-extrabold text-ink">تعذّر عرض ملف الدرس</h2>
      <p class="text-sm text-muted mt-2 max-w-xs leading-relaxed">قد يكون الملف غير متاح حاليًا أو تم نقله. حاول مرة أخرى لاحقًا.</p>
      <button id="error-back-btn"
              class="btn-primary mt-6 inline-flex items-center gap-2 bg-primary hover:bg-primary-hover text-white text-sm font-bold rounded-xl px-5 py-2.5 shadow-card">
        رجوع
      </button>
    </div>

    <!-- PDF embed -->
    <iframe id="pdf-frame" class="w-full h-full border-0" title="عرض الدرس"></iframe>
  </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script src="assets/js/lesson.js"></script>
</body>
</html>
