<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lessons Hub — تسجيل دخول الأدمن</title>

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Design tokens for Tailwind (same as the rest of the site) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#4F46E5', hover: '#4338CA', soft: '#EEF2FF' },
            ink: '#1F2937',
            muted: '#6B7280',
            surface: '#FFFFFF',
            page: '#FAFAFA',
          },
          fontFamily: { cairo: ['Cairo', 'sans-serif'] },
          boxShadow: {
            card: '0 2px 10px rgba(17, 24, 39, 0.05), 0 1px 2px rgba(17, 24, 39, 0.04)',
            'card-hover': '0 16px 32px rgba(79, 70, 229, 0.14), 0 4px 10px rgba(17, 24, 39, 0.06)',
          },
          borderRadius: { card: '0.75rem' },
        }
      }
    }
  </script>

  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body class="font-cairo bg-page text-ink min-h-screen flex flex-col">

  <!-- ============ AUTH PAGE (centered, no site header/footer) ============ -->
  <main class="flex-1 flex flex-col items-center justify-center px-4 py-12">

    <!-- Logo / brand above the card -->
    <a href="../index.html" class="anim-init flex items-center gap-2.5 mb-8 group">
      <span class="w-11 h-11 rounded-xl bg-primary text-white flex items-center justify-center text-xl shadow-card transition-transform duration-300 group-hover:scale-105">
        📚
      </span>
      <span class="text-xl font-extrabold tracking-tight text-ink">Lessons Hub</span>
    </a>

    <!-- Login card -->
    <div class="anim-init auth-card w-full max-w-sm bg-surface rounded-card shadow-card p-7 sm:p-8" style="animation-delay: 120ms">

      <h1 class="text-xl font-extrabold text-ink text-center">تسجيل دخول الأدمن</h1>
      <p class="text-sm text-muted text-center mt-2 mb-7">أدخل بياناتك للوصول إلى لوحة التحكم</p>

      <form id="login-form" class="flex flex-col gap-4" novalidate>

        <!-- Email -->
        <div class="flex flex-col gap-1.5">
          <label for="email-input" class="text-sm font-bold text-ink">البريد الإلكتروني</label>
          <input id="email-input" type="email" name="email" autocomplete="email" required
                 placeholder="admin@example.com"
                 class="auth-input w-full bg-gray-50 text-sm rounded-xl px-4 py-3 text-ink placeholder:text-muted/70 outline-none border border-transparent" />
        </div>

        <!-- Password -->
        <div class="flex flex-col gap-1.5">
          <label for="password-input" class="text-sm font-bold text-ink">كلمة المرور</label>
          <input id="password-input" type="password" name="password" autocomplete="current-password" required
                 placeholder="••••••••"
                 class="auth-input w-full bg-gray-50 text-sm rounded-xl px-4 py-3 text-ink placeholder:text-muted/70 outline-none border border-transparent" />
        </div>

        <!-- Error message (hidden by default) -->
        <div id="login-error" class="hidden flex items-center gap-2 bg-red-50 border border-red-100 text-red-600 text-sm font-semibold rounded-xl px-4 py-3" role="alert">
          <svg class="w-4.5 h-4.5 w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v5m0 3h.01" stroke-linecap="round"></path>
          </svg>
          <span id="login-error-text">البريد الإلكتروني أو كلمة المرور غير صحيحة</span>
        </div>

        <!-- Submit -->
        <button id="login-submit" type="submit"
                class="btn-primary mt-1 w-full inline-flex justify-center items-center gap-2 bg-primary hover:bg-primary-hover text-white font-bold text-sm px-7 py-3.5 rounded-xl shadow-card disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none">
          <span id="submit-label">تسجيل الدخول</span>
          <svg id="submit-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4z"></path>
          </svg>
        </button>
      </form>
    </div>

    <a href="../index.html" class="anim-init mt-8 text-sm font-semibold text-muted hover:text-primary transition-colors duration-200" style="animation-delay: 240ms">
      → العودة إلى الموقع
    </a>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabaseClient.js"></script>
<script src="../assets/js/admin-login.js"></script>
</body>
</html>
